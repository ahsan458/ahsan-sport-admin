name: Deploy block-staff Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/block-staff/**"
      - ".github/workflows/deploy-block-staff.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy block-staff
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy block-staff --project-ref bsjqhheolhzdybotorrl
